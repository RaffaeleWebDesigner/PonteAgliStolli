name: Sincronizza dal foglio Google

# Legge il foglio Google della squadra e aggiorna i dati del sito (assets/js/data.js).
# Se nel foglio c'e' un errore NON cambia niente: il sito resta com'e' e qui compare l'errore con la riga da correggere.
on:
  workflow_dispatch:          # si puo' lanciare a mano: Actions > "Sincronizza dal foglio Google" > Run workflow
  schedule:
    - cron: "*/15 * * * *"    # ogni 15 minuti circa (GitHub puo' ritardare di qualche minuto)

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-foglio
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il sito
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Legge il foglio e prepara i nuovi dati
        run: python tools/sync_sheet.py

      - name: Controlla che il file dei dati sia valido
        run: node --check assets/js/data.js

      - name: Pubblica le novita'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- assets/js/data.js; then
            echo "Nessuna novita' nel foglio: non cambio niente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/data.js
          git commit -m "Aggiornamento automatico dal foglio Google"
          git pull --rebase origin main
          git push origin main
          # i commit fatti da questo programma non avviano da soli la pubblicazione: la richiedo io
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Richiesta di pubblicazione non necessaria."
